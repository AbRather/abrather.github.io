<section id="photos" class="photos">
    <div class="container" data-aos="fade-up">
        
        <div class="section-title">
            <h2><span data-i18n="photos.title">PHOTOS</span></h2>
            <p><span data-i18n="photos.description">A collection of memorable moments and places</span></p>
        </div>

        <div class="photos-gallery">
            {% for photo in site.data.photos %}
            <div class="photo-item" data-category="{{ photo.category }}">
                <div class="photo-wrapper" data-image="{{ photo.image }}" data-title="{{ photo.title }}" data-description="{{ photo.description }}">
                    <img src="{{ photo.image }}" alt="{{ photo.title }}" loading="lazy">
                    <div class="photo-overlay">
                        <div class="photo-info">
                            <h3>{{ photo.title }}</h3>
                            <p>{{ photo.description }}</p>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</section>

<!-- Photo Modal -->
<div id="photoModal" class="photo-modal">
    <span class="photo-modal-close">&times;</span>
    <button class="photo-modal-nav photo-modal-prev">
        <i class="fa fa-chevron-left"></i>
    </button>
    <button class="photo-modal-nav photo-modal-next">
        <i class="fa fa-chevron-right"></i>
    </button>
    <div class="photo-modal-content">
        <img id="modalImage" src="" alt="">
        <div class="photo-modal-caption">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('photoModal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalDescription = document.getElementById('modalDescription');
    const closeBtn = document.querySelector('.photo-modal-close');
    const prevBtn = document.querySelector('.photo-modal-prev');
    const nextBtn = document.querySelector('.photo-modal-next');
    
    let currentPhotoIndex = 0;
    let photos = [];
    
    // Collect all photos data
    document.querySelectorAll('.photo-wrapper').forEach((wrapper, index) => {
        photos.push({
            image: wrapper.dataset.image,
            title: wrapper.dataset.title,
            description: wrapper.dataset.description,
            element: wrapper
        });
    });
    
    // Open modal on photo click
    document.querySelectorAll('.photo-wrapper').forEach((wrapper, index) => {
        wrapper.addEventListener('click', function() {
            currentPhotoIndex = index;
            openModal(currentPhotoIndex);
        });
    });
    
    let scrollPosition = 0;
    
    function openModal(index) {
        const photo = photos[index];
        modalImage.src = photo.image;
        modalTitle.textContent = photo.title;
        modalDescription.textContent = photo.description;
        
        // Save scroll position before locking
        scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollPosition}px`;
        document.body.style.width = '100%';
        
        // Update navigation buttons visibility
        prevBtn.style.display = index > 0 ? 'flex' : 'none';
        nextBtn.style.display = index < photos.length - 1 ? 'flex' : 'none';
    }
    
    function closeModal() {
        modal.classList.remove('show');
        
        // Restore scroll position
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.width = '';
        window.scrollTo(0, scrollPosition);
    }
    
    // Close modal
    closeBtn.addEventListener('click', closeModal);
    
    // Close on background click
    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            closeModal();
        }
    });
    
    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('show')) {
            closeModal();
        } else if (e.key === 'ArrowLeft' && modal.classList.contains('show') && currentPhotoIndex > 0) {
            navigatePhoto(-1);
        } else if (e.key === 'ArrowRight' && modal.classList.contains('show') && currentPhotoIndex < photos.length - 1) {
            navigatePhoto(1);
        }
    });
    
    // Navigation
    prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        navigatePhoto(-1);
    });
    
    nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        navigatePhoto(1);
    });
    
    function navigatePhoto(direction) {
        currentPhotoIndex += direction;
        if (currentPhotoIndex >= 0 && currentPhotoIndex < photos.length) {
            modalImage.style.opacity = '0';
            modalImage.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                openModal(currentPhotoIndex);
                modalImage.style.opacity = '1';
                modalImage.style.transform = 'scale(1)';
            }, 150);
        }
    }
});
</script>
